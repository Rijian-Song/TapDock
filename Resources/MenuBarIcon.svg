<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
  <!-- TapDock menu bar template icon — Option 2
       Mini rounded window, 3 top-left dots, centered down-chevron, thin Dock line.
       Pure black, designed on a 18×18 pixel grid for isTemplate = true. -->
  <!-- Window outline (1px stroke, pixel-aligned) -->
  <rect x="2.5" y="1.5" width="13" height="10" rx="2" ry="2"
        stroke="#000000" stroke-width="1" fill="none"/>
  <!-- Traffic-light dots -->
  <circle cx="4.5" cy="3.5" r="0.58" fill="#000000"/>
  <circle cx="6.5" cy="3.5" r="0.58" fill="#000000"/>
  <circle cx="8.5" cy="3.5" r="0.58" fill="#000000"/>
  <!-- Centered downward chevron -->
  <path d="M6.5 6.5 L9 9 L11.5 6.5"
        stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Thin Dock line -->
  <path d="M3.5 14.5 L14.5 14.5"
        stroke="#000000" stroke-width="1.15" stroke-linecap="round" fill="none"/>
</svg>
